[project]
name = "mathterpiece"
version = "0.1.0"
description = "A LISP-y DSL for generating interactive mathematical widgets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Leo Torres", email = "leo@leotrs.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
mtp = "mathterpiece.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.94",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test that runs this long prints every thread's stack: a hang once seen in the full suite
# could not be reproduced, so the next one should say where it is.
faulthandler_timeout = 120

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
