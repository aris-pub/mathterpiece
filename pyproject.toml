[project]
name = "mathterpiece"
version = "0.1.0"
description = "A LISP-y DSL for generating interactive mathematical widgets"
readme = "README.md"
authors = [
    { name = "Leo Torres", email = "leo@leotrs.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
