[project]
name = "mathterpiece"
version = "0.1.0"
description = "A language for math you can touch: interactive, accessible, typesafe math figures for the web."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Leo Torres", email = "leo@leotrs.com" }
]
requires-python = ">=3.13"
dependencies = []

keywords = ["math", "figures", "interactive", "accessibility", "svg", "visualization"]

[project.urls]
Homepage = "https://mtp-lang.org"
Documentation = "https://docs.mtp-lang.org"
Specification = "https://spec.mtp-lang.org"
Source = "https://github.com/aris-pub/mathterpiece"
Issues = "https://github.com/aris-pub/mathterpiece/issues"

[project.scripts]
mtp = "mathterpiece.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "jsonschema>=4.26.0",
    "lark>=1.3.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.94",
]
docs = [
    "myst-parser>=5.2.0",
    "pydata-sphinx-theme>=0.24.0",
    "sphinx>=9.2.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinxcontrib-mermaid>=2.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test that runs this long prints every thread's stack: a hang once seen in the full suite
# could not be reproduced, so the next one should say where it is.
faulthandler_timeout = 120
markers = [
    "rule(label): the rule of the spec (docs/spec) that a conformance test checks, by its label",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
