<svg viewBox="0 0 710 404" role="img" aria-labelledby="mtp-dm-title"><title id="mtp-dm-title">Four columns: text in the source, expressions in the parser, values in the compiler and runtime, and containers in the compiler and runtime. Literals such as 3, and compounds such as (+ 1 2) and [1 2], evaluate to primitives. Declarations such as (circle c …) create objects, and compounds such as (if f a b), (fn …) and (rec …) evaluate to objects. A primitive never changes and has no identity. An object has an identity and attributes, each a container. A container is a variable or an attribute, holds one value, and is free, bound or const.</title><defs><marker id="mtp-dm-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mtp-d-headpath" d="M0 0 L10 5 L0 10 z"/></marker></defs><text class="mtp-d-label" x="85" y="16" text-anchor="middle">text in the source</text><text class="mtp-d-label" x="265.0" y="16" text-anchor="middle">expressions</text><text class="mtp-d-label" x="265.0" y="30" text-anchor="middle">in the parser</text><text class="mtp-d-label" x="450.0" y="16" text-anchor="middle">values in the compiler</text><text class="mtp-d-label" x="450.0" y="30" text-anchor="middle">and runtime</text><text class="mtp-d-label" x="630.0" y="16" text-anchor="middle">containers in the</text><text class="mtp-d-label" x="630.0" y="30" text-anchor="middle">compiler and runtime</text><g transform="translate(0,16)"><text class="mtp-d-code" x="85" y="73" text-anchor="middle">3  'hi'  #'red'</text><line class="mtp-d-arrow" x1="162" y1="69" x2="188" y2="69" marker-end="url(#mtp-dm-head)"/><rect class="mtp-d-file" x="190" y="34" width="150" height="70" rx="6"/><text class="mtp-d-name" x="265.0" y="74" text-anchor="middle">literals</text><line class="mtp-d-arrow" x1="340" y1="69" x2="378" y2="69" marker-end="url(#mtp-dm-head)"/><text class="mtp-d-code" x="85" y="157" text-anchor="middle">(+ 1 2)  [1 2]</text><line class="mtp-d-arrow" x1="162" y1="153" x2="188" y2="153" marker-end="url(#mtp-dm-head)"/><rect class="mtp-d-file" x="190" y="118" width="150" height="70" rx="6"/><text class="mtp-d-name" x="265.0" y="158" text-anchor="middle">compounds</text><line class="mtp-d-arrow" x1="340" y1="153" x2="378" y2="153" marker-end="url(#mtp-dm-head)"/><text class="mtp-d-code" x="85" y="252" text-anchor="middle">(circle c …)</text><text class="mtp-d-code" x="85" y="270" text-anchor="middle">(func f …)</text><line class="mtp-d-arrow" x1="162" y1="257" x2="188" y2="257" marker-end="url(#mtp-dm-head)"/><rect class="mtp-d-file" x="190" y="222" width="150" height="70" rx="6"/><text class="mtp-d-name" x="265.0" y="262" text-anchor="middle">declarations</text><line class="mtp-d-arrow" x1="340" y1="257" x2="378" y2="257" marker-end="url(#mtp-dm-head)"/><text class="mtp-d-code" x="85" y="336" text-anchor="middle">(if f a b)</text><text class="mtp-d-code" x="85" y="354" text-anchor="middle">(fn …)  (rec …)</text><line class="mtp-d-arrow" x1="162" y1="341" x2="188" y2="341" marker-end="url(#mtp-dm-head)"/><rect class="mtp-d-file" x="190" y="306" width="150" height="70" rx="6"/><text class="mtp-d-name" x="265.0" y="346" text-anchor="middle">compounds</text><line class="mtp-d-arrow" x1="340" y1="341" x2="378" y2="341" marker-end="url(#mtp-dm-head)"/><rect class="mtp-d-part" x="380" y="34" width="140" height="154" rx="6"/><text class="mtp-d-name" x="450.0" y="96" text-anchor="middle">primitive</text><text class="mtp-d-sub" x="450.0" y="118" text-anchor="middle">never changes,</text><text class="mtp-d-sub" x="450.0" y="134" text-anchor="middle">has no identity</text><rect class="mtp-d-part" x="380" y="222" width="140" height="154" rx="6"/><text class="mtp-d-name" x="450.0" y="276" text-anchor="middle">object</text><text class="mtp-d-sub" x="450.0" y="298" text-anchor="middle">has an identity</text><text class="mtp-d-sub" x="450.0" y="314" text-anchor="middle">and attributes,</text><text class="mtp-d-sub" x="450.0" y="330" text-anchor="middle">each a container</text><rect class="mtp-d-part" x="560" y="155" width="140" height="104" rx="6"/><text class="mtp-d-name" x="630.0" y="179" text-anchor="middle">container</text><text class="mtp-d-sub" x="630.0" y="199" text-anchor="middle">a variable or</text><text class="mtp-d-sub" x="630.0" y="215" text-anchor="middle">an attribute</text><text class="mtp-d-sub" x="630.0" y="242" text-anchor="middle">free, bound or const</text><line class="mtp-d-arrow" x1="560" y1="182" x2="522" y2="140" marker-end="url(#mtp-dm-head)"/><line class="mtp-d-arrow" x1="560" y1="228" x2="522" y2="270" marker-end="url(#mtp-dm-head)"/><text class="mtp-d-label" x="630.0" y="145" text-anchor="middle">holds one</text></g></svg>
