<svg viewBox="0 0 780 580" role="img" aria-labelledby="mtp-bt-title"><title id="mtp-bt-title">The built-in types as sets. Values are primitives or objects. Among the primitives, int is inside ratio, inside real, inside complex, rand-seed is the same set as int, unit, the reals from 0 to 1, is inside real and overlaps int and ratio, bool, string, color, point, none and the list types are separate. Among the objects, every shape type, motif type and variant type is inside shape, ease, curve and colormap are inside func, font is inside record, views, controls and listeners are inside component, every animation type is inside movement, scene, formula and term are separate.</title><rect class="mtp-d-file" x="10" y="10" width="760" height="560" rx="6"/><text class="mtp-d-label" x="24" y="30" text-anchor="start">values</text><rect class="mtp-d-part" x="24" y="42" width="330" height="516" rx="6"/><text class="mtp-d-name" x="38" y="64" text-anchor="start">primitives</text><rect class="mtp-d-file" x="38" y="76" width="302" height="210" rx="6"/><text class="mtp-d-code" x="50" y="96" text-anchor="start">complex</text><rect class="mtp-d-part" x="52" y="106" width="274" height="170" rx="6"/><text class="mtp-d-code" x="64" y="126" text-anchor="start">real</text><rect class="mtp-d-file" x="66" y="136" width="170" height="128" rx="6"/><text class="mtp-d-code" x="78" y="156" text-anchor="start">ratio</text><rect class="mtp-d-part" x="80" y="166" width="120" height="86" rx="6"/><text class="mtp-d-code" x="92" y="188" text-anchor="start">int</text><text class="mtp-d-sub" x="92" y="206" text-anchor="start">same set:</text><text class="mtp-d-code" x="92" y="224" text-anchor="start">rand-seed</text><rect class="mtp-d-file" x="190" y="200" width="124" height="60" rx="6" stroke-dasharray="5 4"/><text class="mtp-d-code" x="304" y="218" text-anchor="end">unit</text><text class="mtp-d-sub" x="304" y="236" text-anchor="end">the reals</text><text class="mtp-d-sub" x="304" y="252" text-anchor="end">from 0 to 1</text><rect class="mtp-d-file" x="38" y="300" width="146" height="42" rx="6"/><text class="mtp-d-code" x="111" y="326" text-anchor="middle">bool</text><rect class="mtp-d-file" x="194" y="300" width="146" height="42" rx="6"/><text class="mtp-d-code" x="267" y="326" text-anchor="middle">string</text><rect class="mtp-d-file" x="38" y="352" width="146" height="42" rx="6"/><text class="mtp-d-code" x="111" y="378" text-anchor="middle">color</text><rect class="mtp-d-file" x="194" y="352" width="146" height="42" rx="6"/><text class="mtp-d-code" x="267" y="378" text-anchor="middle">point</text><rect class="mtp-d-file" x="38" y="404" width="146" height="42" rx="6"/><text class="mtp-d-code" x="111" y="430" text-anchor="middle">none</text><rect class="mtp-d-file" x="194" y="404" width="146" height="42" rx="6"/><text class="mtp-d-code" x="267" y="430" text-anchor="middle">list[T]</text><text class="mtp-d-sub" x="38" y="474" text-anchor="start">each list[T] holds the lists whose</text><text class="mtp-d-sub" x="38" y="492" text-anchor="start">items belong to T</text><rect class="mtp-d-part" x="368" y="42" width="388" height="516" rx="6"/><text class="mtp-d-name" x="382" y="64" text-anchor="start">objects</text><rect class="mtp-d-file" x="382" y="76" width="192" height="214" rx="6"/><text class="mtp-d-code" x="394" y="96" text-anchor="start">shape</text><text class="mtp-d-code" x="394" y="122" text-anchor="start">circle  rect  ellipse</text><text class="mtp-d-code" x="394" y="142" text-anchor="start">line  triangle</text><text class="mtp-d-code" x="394" y="162" text-anchor="start">polyline  polygon</text><text class="mtp-d-code" x="394" y="182" text-anchor="start">bezier  arc  ring</text><text class="mtp-d-code" x="394" y="202" text-anchor="start">text  group</text><rect class="mtp-d-part" x="394" y="226" width="168" height="52" rx="6"/><text class="mtp-d-sub" x="404" y="246" text-anchor="start">each motif type M</text><text class="mtp-d-sub" x="404" y="264" text-anchor="start">each variant type V</text><rect class="mtp-d-file" x="584" y="76" width="158" height="128" rx="6"/><text class="mtp-d-code" x="594" y="96" text-anchor="start">func</text><rect class="mtp-d-part" x="594" y="106" width="138" height="24" rx="6"/><text class="mtp-d-code" x="663" y="123" text-anchor="middle">ease</text><rect class="mtp-d-part" x="594" y="136" width="138" height="24" rx="6"/><text class="mtp-d-code" x="663" y="153" text-anchor="middle">curve</text><rect class="mtp-d-part" x="594" y="166" width="138" height="24" rx="6"/><text class="mtp-d-code" x="663" y="183" text-anchor="middle">colormap</text><rect class="mtp-d-file" x="584" y="214" width="158" height="76" rx="6"/><text class="mtp-d-code" x="594" y="234" text-anchor="start">record</text><rect class="mtp-d-part" x="594" y="244" width="138" height="34" rx="6"/><text class="mtp-d-code" x="663" y="266" text-anchor="middle">font</text><rect class="mtp-d-file" x="382" y="302" width="360" height="170" rx="6"/><text class="mtp-d-code" x="394" y="322" text-anchor="start">component</text><rect class="mtp-d-part" x="394" y="332" width="108" height="130" rx="6"/><text class="mtp-d-code" x="404" y="352" text-anchor="start">view</text><text class="mtp-d-sub" x="404" y="372" text-anchor="start">canvas</text><text class="mtp-d-sub" x="404" y="389" text-anchor="start">readout</text><text class="mtp-d-sub" x="404" y="406" text-anchor="start">display</text><rect class="mtp-d-part" x="510" y="332" width="108" height="130" rx="6"/><text class="mtp-d-code" x="520" y="352" text-anchor="start">control</text><text class="mtp-d-sub" x="520" y="372" text-anchor="start">slider</text><text class="mtp-d-sub" x="520" y="389" text-anchor="start">button</text><text class="mtp-d-sub" x="520" y="406" text-anchor="start">play</text><text class="mtp-d-sub" x="520" y="423" text-anchor="start">stepper</text><text class="mtp-d-sub" x="520" y="440" text-anchor="start">toggle</text><rect class="mtp-d-part" x="626" y="332" width="108" height="130" rx="6"/><text class="mtp-d-code" x="636" y="352" text-anchor="start">listener</text><text class="mtp-d-sub" x="636" y="372" text-anchor="start">on-drag</text><text class="mtp-d-sub" x="636" y="389" text-anchor="start">on-click</text><text class="mtp-d-sub" x="636" y="406" text-anchor="start">on-enter</text><text class="mtp-d-sub" x="636" y="423" text-anchor="start">…</text><rect class="mtp-d-file" x="382" y="484" width="146" height="62" rx="6"/><text class="mtp-d-code" x="392" y="504" text-anchor="start">movement</text><rect class="mtp-d-part" x="390" y="512" width="130" height="26" rx="6"/><text class="mtp-d-sub" x="455.0" y="529" text-anchor="middle">each animation type A</text><rect class="mtp-d-file" x="536" y="484" width="62" height="62" rx="6"/><text class="mtp-d-code" x="546" y="504" text-anchor="start">scene</text><rect class="mtp-d-file" x="606" y="484" width="82" height="62" rx="6"/><text class="mtp-d-code" x="616" y="504" text-anchor="start">formula</text><rect class="mtp-d-file" x="696" y="484" width="54" height="62" rx="6"/><text class="mtp-d-code" x="706" y="504" text-anchor="start">term</text></svg>
