<svg viewBox="0 0 560 458" role="img" aria-labelledby="mtp-items-title"><title id="mtp-items-title">Six kinds of expression that the parser produces, one under the other: literals, names, compounds, declarations, clauses and special forms. All six are expressions. Compounds, declarations, clauses and special forms are forms. A literal evaluates to a primitive, a name to what it refers to, a compound to a value or a type, a declaration creates a variable, a type or an object, a clause has no result and is part of the form around it, and a special form, a let or a foreach in a body, is replaced by its items.</title><text class="mtp-d-label" x="305.0" y="18" text-anchor="middle">what the parser produces</text><rect class="mtp-d-file" x="120" y="30" width="370" height="62" rx="6"/><text class="mtp-d-name" x="134" y="55" text-anchor="start">literals</text><text class="mtp-d-code" x="134" y="76" text-anchor="start">3  'hi'  true  none</text><text class="mtp-d-sub" x="478" y="65.0" text-anchor="end">evaluates to a primitive</text><rect class="mtp-d-file" x="120" y="102" width="370" height="62" rx="6"/><text class="mtp-d-name" x="134" y="127" text-anchor="start">names</text><text class="mtp-d-code" x="134" y="148" text-anchor="start">a  real  circle</text><text class="mtp-d-sub" x="478" y="129.0" text-anchor="end">evaluates to what</text><text class="mtp-d-sub" x="478" y="145.0" text-anchor="end">it refers to</text><rect class="mtp-d-file" x="120" y="174" width="370" height="62" rx="6"/><text class="mtp-d-name" x="134" y="199" text-anchor="start">compounds</text><text class="mtp-d-code" x="134" y="220" text-anchor="start">(+ 1 2)  (list-of 1 2)</text><text class="mtp-d-sub" x="478" y="201.0" text-anchor="end">evaluates to a value</text><text class="mtp-d-sub" x="478" y="217.0" text-anchor="end">or a type</text><rect class="mtp-d-file" x="120" y="246" width="370" height="62" rx="6"/><text class="mtp-d-name" x="134" y="271" text-anchor="start">declarations</text><text class="mtp-d-code" x="134" y="292" text-anchor="start">(real a 1)  (circle c …)</text><text class="mtp-d-sub" x="478" y="273.0" text-anchor="end">creates a variable,</text><text class="mtp-d-sub" x="478" y="289.0" text-anchor="end">a type or an object</text><rect class="mtp-d-file" x="120" y="318" width="370" height="62" rx="6"/><text class="mtp-d-name" x="134" y="343" text-anchor="start">clauses</text><text class="mtp-d-code" x="134" y="364" text-anchor="start">(r 1)  (else 0)</text><text class="mtp-d-sub" x="478" y="337.0" text-anchor="end">has no result, and is</text><text class="mtp-d-sub" x="478" y="353.0" text-anchor="end">part of the form</text><text class="mtp-d-sub" x="478" y="369.0" text-anchor="end">around it</text><path class="mtp-d-arrow" fill="none" d="M114 34 H104 V448 H114"/><text class="mtp-d-label" x="98" y="245.0" text-anchor="end">expressions</text><path class="mtp-d-arrow" fill="none" d="M496 178 H506 V448 H496"/><text class="mtp-d-label" x="512" y="317.0" text-anchor="start">forms</text><rect class="mtp-d-file" x="120" y="390" width="370" height="62" rx="6"/><text class="mtp-d-name" x="134" y="415" text-anchor="start">special forms</text><text class="mtp-d-code" x="134" y="436" text-anchor="start">(let …)  (foreach …)</text><text class="mtp-d-sub" x="478" y="417.0" text-anchor="end">in a body: replaced</text><text class="mtp-d-sub" x="478" y="433.0" text-anchor="end">by its items</text></svg>
