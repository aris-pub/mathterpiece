<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mathterpiece figures</title>
    <style>
      /* The page's own look, kept in tokens so the dark page can change them. A figure's look is
         its own: only the token overrides further down restyle it. */
      :root {
        --page-bg: #fbfaf7;
        --page-fg: #22252b;
        --muted: #646a75;
        --rule: #e3e0d8;
        --panel: #f3f1ec;
        --accent: #2f5d8a;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--page-bg);
        color: var(--page-fg);
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      header {
        border-bottom: 1px solid var(--rule);
        background: var(--panel);
      }
      .bar {
        max-width: 880px;
        margin: 0 auto;
        padding: 0.75rem 1.25rem;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
      }
      .brand { font-weight: 600; letter-spacing: 0.01em; margin-right: auto; }
      .bar select, .bar button {
        font: inherit;
        font-size: 14px;
        color: var(--page-fg);
        background: var(--page-bg);
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 0.3rem 0.7rem;
        cursor: pointer;
      }
      .bar button[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }
      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 1.75rem 1.25rem 4rem;
        display: grid;
        gap: 1.25rem;
      }
      h1 { margin: 0; font-size: 1.75rem; line-height: 1.2; font-weight: 600; }
      #about { color: var(--muted); }
      #about p { margin: 0 0 0.6em; text-wrap: pretty; }
      #about p:last-child { margin-bottom: 0; }
      mtp-canvas { display: block; width: 100%; }
      mtp-canvas svg { display: block; width: 100%; height: auto; border-radius: 8px; }
      #canvases { display: grid; gap: 1rem; }
      /* The controls keep the runtime's own look: the page only lays them out side by side. */
      #controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1.25rem; }
      #controls:empty { display: none; }
      #controls > p { flex-basis: 100%; margin: 0; }
      details { color: var(--muted); font-size: 14px; }
      summary { cursor: pointer; }
      #values { border-collapse: collapse; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; margin-top: 0.5rem; }
      #values td { padding: 0.15rem 1rem 0.15rem 0; border-bottom: 1px solid var(--rule); }
      /* A page restyling a figure's color tokens: no mtp involved, only CSS. */
      :root.dark {
        --page-bg: #14161c; --page-fg: #e8e4d8; --muted: #a3a9b5; --rule: #2c3039; --panel: #1b1e25;
        --accent: #8db7e0; color-scheme: dark;
        --mtp-ink: #e8e4d8; --mtp-paper: #14161c;
        --mtp-soft: #8f97a8; --mtp-terracotta: #f08a6c; --mtp-teal: #4cc2b3; --mtp-saffron: #f2d27e;
        --mtp-plum: #a88bb8;
        /* The same, for the examples that import their tokens from house.mtp. */
        --mtp-house-ink: #e8e4d8; --mtp-house-paper: #14161c; --mtp-house-soft: #8f97a8;
        --mtp-house-terracotta: #f08a6c; --mtp-house-teal: #4cc2b3; --mtp-house-saffron: #f2d27e;
        --mtp-house-plum: #a88bb8;
      }
      /* A page restyling a figure's type tokens, also only with CSS. */
      :root.fonts {
        --mtp-heading-family: Palatino, "Book Antiqua", serif;
        --mtp-heading-style: italic;
        --mtp-variable-family: "Times New Roman", serif;
        --mtp-number-family: "Courier New", monospace;
        --mtp-number-weight: 700;
        --mtp-house-variable-family: "Times New Roman", serif;
        --mtp-house-number-family: "Courier New", monospace;
        --mtp-house-number-weight: 700;
      }
    </style>
  </head>
  <body>
    <!-- For trying the runtime by hand: just web-dev, then pick a figure: the examples, the demo,
         the shared cases or the runtime's test fixtures, built to .mtpc by just web-examples. -->
    <header>
      <div class="bar">
        <span class="brand">mathterpiece</span>
        <label for="pick" hidden>figure</label>
        <select id="pick"></select>
        <button id="view" type="button" aria-pressed="false">inventory</button>
        <button id="theme" type="button" aria-pressed="false">dark page</button>
        <button id="fonts" type="button" aria-pressed="false">page fonts</button>
      </div>
    </header>
    <main>
      <h1 id="title"></h1>
      <div id="about"></div>
      <mtp-model id="m"></mtp-model>
      <div id="inventory" hidden></div>
      <div id="canvases"></div>
      <div id="controls"></div>
      <details id="variables">
        <summary>every variable and its value</summary>
        <table id="values"></table>
      </details>
    </main>
    <script type="module">
      import "/src/index.ts";
      import { inventory } from "/src/inventory.ts";
      const figures = import.meta.glob(
        ["/test/data/examples/*.mtpc", "/test/data/demo/*.mtpc"],
        { query: "?raw", import: "default" },
      );
      const sources = import.meta.glob(
        ["/test/data/examples/*.mtp", "/test/data/demo/*.mtp"],
        { query: "?raw", import: "default" },
      );
      const examples = Object.keys(figures);
      const pick = document.getElementById("pick");
      const name = (path) => path.split("/").pop().replace(".mtpc", "");
      for (const path of examples) pick.add(new Option(name(path), path));
      const params = new URLSearchParams(location.search);
      const chosen = params.get("example");
      // Each example shows either as here, or as the inventory page mtp build writes.
      const viewButton = document.getElementById("view");
      let showInventory = params.get("view") === "inventory";
      pick.value = examples.find((p) => name(p) === (chosen ?? "controls")) ?? examples[0];
      const load = async () => {
        const text = await figures[pick.value]();
        const doc = JSON.parse(text);
        // What the figure is and what to try: its leading comments.
        const source = await sources[pick.value.replace(/\.mtpc$/, ".mtp")]?.();
        // Only the comments the file starts with; the rest explain the code.
        const lines = (source ?? "").split("\n");
        const end = lines.findIndex((l) => l.trim() !== "" && !l.startsWith(";"));
        const about = lines
          .slice(0, end < 0 ? lines.length : end)
          .filter((l) => l.startsWith(";"))
          .map((l) => l.replace(/^;+ ?/, "").trim());
        // The comment's line breaks are the source's, not the text's: its lines run together, and
        // an empty comment line starts a new paragraph.
        const paragraphs = about.join("\n").split(/\n\s*\n/).map((p) => p.split("\n").join(" ").trim());
        document.getElementById("about").replaceChildren(
          ...paragraphs.filter((p) => p).map((p) => Object.assign(document.createElement("p"), { textContent: p })),
        );
        const controls = document.getElementById("controls");
        controls.replaceChildren();
        const canvases = document.getElementById("canvases");
        canvases.replaceChildren();
        // Token values set from an inventory belong to the example they were set on.
        document.documentElement.removeAttribute("style");
        // Canvases and block displays, in the order the source declares them.
        const blocks = (o) => o.kind === "canvas" || (o.kind === "display" && o.as === "block");
        for (const o of showInventory ? [] : doc.objects.filter(blocks)) {
          const el = document.createElement(`mtp-${o.kind}`);
          el.setAttribute("model", "m");
          el.setAttribute("name", o.name);
          canvases.append(el);
        }
        document.getElementById("m").doc = doc;
        viewButton.setAttribute("aria-pressed", String(showInventory));
        const inv = document.getElementById("inventory");
        for (const id of ["canvases", "controls", "variables"]) document.getElementById(id).hidden = showInventory;
        inv.hidden = !showInventory;
        if (showInventory) {
          // The inventory places its own components, so the usual view places none.
          inventory(inv, text, { model: "m", id: name(pick.value), file: `${name(pick.value)}.mtpc` });
        } else {
          inv.replaceChildren();
        }
        for (const o of showInventory ? [] : doc.objects) {
          if (o.kind === "readout" || (o.kind === "display" && o.as === "inline")) {
            const p = document.createElement("p");
            p.append(`A sentence with the ${o.kind} ${o.name} in it: `);
            const el = document.createElement(`mtp-${o.kind}`);
            el.setAttribute("model", "m");
            el.setAttribute("name", o.name);
            p.append(el, ", and then the sentence goes on.");
            controls.append(p);
            continue;
          }
          if (!["slider", "toggle", "button", "play"].includes(o.kind)) continue;
          const el = document.createElement(`mtp-${o.kind}`);
          el.setAttribute("model", "m");
          el.setAttribute("name", o.name);
          controls.append(el);
        }
        // Every variable and its value, kept current, for figures that are mostly values.
        const model = document.getElementById("m");
        const table = document.getElementById("values");
        const rows = doc.objects.flatMap((o, i) => (o.kind === "variable" ? [[o.name ?? `#${i}`, i]] : []));
        const show = () => {
          table.replaceChildren(
            ...rows.map(([n, i]) => {
              const tr = document.createElement("tr");
              const v = model.runtime?.value(i);
              for (const text of [n, JSON.stringify(v)]) {
                const td = document.createElement("td");
                td.textContent = text;
                tr.append(td);
              }
              return tr;
            }),
          );
        };
        model.addEventListener("mtp-change", show);
        show();
        document.getElementById("title").textContent = name(pick.value);
        document.title = `${name(pick.value)} · mathterpiece`;
        history.replaceState(null, "", `?example=${name(pick.value)}${showInventory ? "&view=inventory" : ""}`);
      };
      pick.onchange = load;
      viewButton.onclick = () => {
        showInventory = !showInventory;
        load();
      };
      for (const [id, cls] of [["theme", "dark"], ["fonts", "fonts"]]) {
        const b = document.getElementById(id);
        b.onclick = () => b.setAttribute("aria-pressed", String(document.documentElement.classList.toggle(cls)));
      }
      load();
    </script>
  </body>
</html>
