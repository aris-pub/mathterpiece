<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mathterpiece figures</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; }
      mtp-canvas { display: block; width: min(90vw, 640px); }
      mtp-canvas svg { width: 100%; height: auto; }
      #controls > * { display: block; margin: 0.5rem 0; }
      #about { white-space: pre-wrap; font-family: system-ui, sans-serif; color: #555; max-width: 640px; }
      #values { border-collapse: collapse; font-family: ui-monospace, monospace; margin-top: 1rem; }
      #values td { padding: 0.1rem 0.8rem 0.1rem 0; }
      [aria-pressed="true"] { font-weight: bold; }
      /* A page restyling a figure's color tokens: no mtp involved, only CSS. */
      :root.dark { background: #14161c; color: #e8e4d8; --mtp-ink: #e8e4d8; --mtp-paper: #14161c; }
      /* A page restyling a figure's type tokens, also only with CSS. */
      :root.fonts {
        --mtp-heading-family: Palatino, "Book Antiqua", serif;
        --mtp-heading-style: italic;
        --mtp-variable-family: "Times New Roman", serif;
        --mtp-number-family: "Courier New", monospace;
        --mtp-number-weight: 700;
      }
    </style>
  </head>
  <body>
    <!-- For trying the runtime by hand: just web-dev, then pick a figure: the examples, the demo,
         the shared cases or the runtime's test fixtures, built to .mtpc by just web-examples. -->
    <select id="pick"></select>
    <button id="theme" type="button">dark page</button>
    <button id="fonts" type="button">page fonts</button>
    <pre id="about"></pre>
    <mtp-model id="m"></mtp-model>
    <div id="canvases"></div>
    <div id="controls"></div>
    <table id="values"></table>
    <script type="module">
      import "/src/index.ts";
      const figures = import.meta.glob(
        ["/test/data/examples/*.mtpc", "/test/data/demo/*.mtpc", "/test/data/runtime/*.mtpc"],
        { query: "?raw", import: "default" },
      );
      const sources = import.meta.glob(
        ["/test/data/examples/*.mtp", "/test/data/demo/*.mtp", "/test/data/runtime/*.mtp"],
        { query: "?raw", import: "default" },
      );
      const examples = Object.keys(figures);
      const pick = document.getElementById("pick");
      const name = (path) => path.split("/").pop().replace(".mtpc", "");
      for (const path of examples) pick.add(new Option(name(path), path));
      const chosen = new URLSearchParams(location.search).get("example");
      pick.value = examples.find((p) => name(p) === (chosen ?? "controls")) ?? examples[0];
      const load = async () => {
        const doc = JSON.parse(await figures[pick.value]());
        // What the figure is and what to try: its leading comments.
        const source = await sources[pick.value.replace(/\.mtpc$/, ".mtp")]?.();
        // Only the comments the file starts with; the rest explain the code.
        const lines = (source ?? "").split("\n");
        const end = lines.findIndex((l) => l.trim() !== "" && !l.startsWith(";"));
        const about = lines
          .slice(0, end < 0 ? lines.length : end)
          .filter((l) => l.startsWith(";") && !/^; (expect|write|page)\b/.test(l))
          .map((l) => l.replace(/^;+ ?/, ""));
        document.getElementById("about").textContent = about.join("\n");
        // A figure with no canvas of its own, such as most runtime figures, is shown in one that
        // draws its whole scene, so there is always something to see.
        const scene = doc.objects.findIndex((o) => o.kind === "scene");
        if (scene >= 0 && !doc.objects.some((o) => o.kind === "canvas")) {
          const free = (v) => ({ type: "real", free: v });
          doc.names["whole scene"] = doc.objects.length;
          doc.objects.push({
            kind: "canvas", type: { component: "canvas" }, access: "page", name: "whole scene",
            members: [scene], when: [], transition: null,
            attrs: {
              "view-x": free(-10), "view-y": free(-10), "view-width": free(20), "view-height": free(20),
              transform: { type: "transform", free: [1, 0, 0, 1, 0, 0] },
            },
          });
        }
        const controls = document.getElementById("controls");
        controls.replaceChildren();
        const canvases = document.getElementById("canvases");
        canvases.replaceChildren();
        for (const o of doc.objects.filter((o) => o.kind === "canvas")) {
          const el = document.createElement("mtp-canvas");
          el.setAttribute("model", "m");
          el.setAttribute("name", o.name);
          canvases.append(el);
        }
        document.getElementById("m").doc = doc;
        for (const o of doc.objects) {
          if (o.kind === "readout") {
            const p = document.createElement("p");
            p.append(`A sentence with the readout ${o.name} in it: `);
            const el = document.createElement("mtp-readout");
            el.setAttribute("model", "m");
            el.setAttribute("name", o.name);
            p.append(el, ", and then the sentence goes on.");
            controls.append(p);
            continue;
          }
          if (!["slider", "toggle", "button", "play"].includes(o.kind)) continue;
          const el = document.createElement(`mtp-${o.kind}`);
          el.setAttribute("model", "m");
          el.setAttribute("name", o.name);
          controls.append(el);
        }
        // Every variable and its value, kept current, for figures that are mostly values.
        const model = document.getElementById("m");
        const table = document.getElementById("values");
        const rows = doc.objects.flatMap((o, i) => (o.kind === "variable" ? [[o.name ?? `#${i}`, i]] : []));
        const show = () => {
          table.replaceChildren(
            ...rows.map(([n, i]) => {
              const tr = document.createElement("tr");
              const v = model.runtime?.value(i);
              for (const text of [n, JSON.stringify(v)]) {
                const td = document.createElement("td");
                td.textContent = text;
                tr.append(td);
              }
              return tr;
            }),
          );
        };
        model.addEventListener("mtp-change", show);
        show();
        history.replaceState(null, "", `?example=${name(pick.value)}`);
      };
      pick.onchange = load;
      document.getElementById("theme").onclick = () => document.documentElement.classList.toggle("dark");
      document.getElementById("fonts").onclick = () => document.documentElement.classList.toggle("fonts");
      load();
    </script>
  </body>
</html>
