<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mathterpiece examples</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; }
      mtp-canvas { display: block; width: min(90vw, 640px); }
      mtp-canvas svg { width: 100%; height: auto; }
      #controls > * { display: block; margin: 0.5rem 0; }
      [aria-pressed="true"] { font-weight: bold; }
      /* A page restyling a figure's color tokens: no mtp involved, only CSS. */
      :root.dark { background: #14161c; color: #e8e4d8; --mtp-ink: #e8e4d8; --mtp-paper: #14161c; }
      /* A page restyling a figure's type tokens, also only with CSS. */
      :root.fonts {
        --mtp-heading-family: Palatino, "Book Antiqua", serif;
        --mtp-heading-style: italic;
        --mtp-variable-family: "Times New Roman", serif;
        --mtp-number-family: "Courier New", monospace;
        --mtp-number-weight: 700;
      }
    </style>
  </head>
  <body>
    <!-- For trying the runtime by hand: just web-dev, then pick an example. -->
    <select id="pick"></select>
    <button id="theme" type="button">dark page</button>
    <button id="fonts" type="button">page fonts</button>
    <mtp-model id="m"></mtp-model>
    <mtp-canvas model="m"></mtp-canvas>
    <div id="controls"></div>
    <script type="module">
      import "/src/index.ts";
      const examples = Object.keys(import.meta.glob("/test/data/examples/*.json"));
      const pick = document.getElementById("pick");
      const name = (path) => path.split("/").pop().replace(".json", "");
      for (const path of examples) pick.add(new Option(name(path), path));
      const chosen = new URLSearchParams(location.search).get("example");
      pick.value = examples.find((p) => name(p) === chosen) ?? examples[0];
      const load = async () => {
        const doc = await (await fetch(pick.value)).json();
        const controls = document.getElementById("controls");
        controls.replaceChildren();
        document.getElementById("m").doc = doc;
        for (const o of doc.objects) {
          if (o.kind === "readout") {
            const p = document.createElement("p");
            p.append(`A sentence with the readout ${o.name} in it: `);
            const el = document.createElement("mtp-readout");
            el.setAttribute("model", "m");
            el.setAttribute("name", o.name);
            p.append(el, ", and then the sentence goes on.");
            controls.append(p);
            continue;
          }
          if (!["slider", "toggle", "button", "play"].includes(o.kind)) continue;
          const el = document.createElement(`mtp-${o.kind}`);
          el.setAttribute("model", "m");
          el.setAttribute("name", o.name);
          controls.append(el);
        }
        history.replaceState(null, "", `?example=${name(pick.value)}`);
      };
      pick.onchange = load;
      document.getElementById("theme").onclick = () => document.documentElement.classList.toggle("dark");
      document.getElementById("fonts").onclick = () => document.documentElement.classList.toggle("fonts");
      load();
    </script>
  </body>
</html>
