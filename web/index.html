<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mathterpiece figures</title>
    <!-- BRAIID, which draws the controls, in a layer of its own: its tokens reach the controls,
         and this page's own rules still win over its look. Added by a script so that Vite does
         not try to inline it. -->
    <script>
      document.head.prepend(Object.assign(document.createElement("style"), {
        textContent: '@import url("https://cdn.jsdelivr.net/gh/aris-pub/rsm@main/braiid/braiid.css") layer(braiid);',
      }));
    </script>
    <style>
      /* The page's own look, kept in tokens so the dark page can change them. A figure's look is
         its own, its dark colors included: only the token overrides further down restyle it. */
      :root {
        --page-bg: #fbfaf7;
        --page-fg: #22252b;
        --muted: #646a75;
        --rule: #e3e0d8;
        --panel: #f3f1ec;
        --accent: #2f5d8a;
        color-scheme: light;
        /* BRAIID sets the root size by the screen's width; this page keeps its own. */
        font-size: 16px;
      }
      * { box-sizing: border-box; }
      /* The page never scrolls: the list of figures and the figure each scroll on their own. */
      body {
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        margin: 0;
        background: var(--page-bg);
        color: var(--page-fg);
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      header {
        border-bottom: 1px solid var(--rule);
        background: var(--panel);
      }
      .bar {
        padding: 0.75rem 1.25rem;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
      }
      .brand { font-weight: 600; letter-spacing: 0.01em; margin-right: auto; }
      .bar button {
        font: inherit;
        font-size: 14px;
        color: var(--page-fg);
        background: var(--page-bg);
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 0.3rem 0.7rem;
        cursor: pointer;
      }
      .bar button[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }
      /* The list of figures on the left, always in view, and the figure beside it. */
      .layout {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 15rem minmax(0, 1fr);
      }
      #stage { overflow-y: auto; min-height: 0; }
      #figures {
        overflow-y: auto;
        min-height: 0;
        border-right: 1px solid var(--rule);
        padding: 1rem 0.75rem 2rem;
        display: grid;
        gap: 0.5rem;
      }
      #filter {
        font: inherit;
        font-size: 14px;
        color: var(--page-fg);
        background: var(--page-bg);
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 0.35rem 0.6rem;
        width: 100%;
      }
      #names { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
      #names button {
        font: inherit;
        font-size: 14px;
        text-align: left;
        width: 100%;
        color: var(--muted);
        background: none;
        border: 0;
        border-radius: 5px;
        padding: 0.25rem 0.55rem;
        cursor: pointer;
      }
      #names button:hover { color: var(--page-fg); background: var(--panel); }
      #names .kind {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 0.9rem 0.55rem 0.25rem;
      }
      #names .kind:first-child { padding-top: 0.25rem; }
      #names button[aria-current="page"] { color: var(--accent); background: var(--panel); font-weight: 600; }
      @media (max-width: 760px) {
        .layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
        #figures { max-height: 14rem; border-right: 0; border-bottom: 1px solid var(--rule); }
      }
      main {
        max-width: 880px;
        width: 100%;
        margin: 0 auto;
        padding: 1.75rem 1.25rem 1.25rem;
        display: grid;
        gap: 1.25rem;
      }
      /* A figure with one canvas: its text in a column beside the canvas, and its controls under
         the canvas, so the canvas takes the window's height (fit, below). */
      @media (min-width: 1000px) {
        main.side {
          max-width: 1500px;
          grid-template-columns: minmax(16rem, 26rem) minmax(0, 1fr);
          grid-template-areas: "title title" "about figure" "about controls";
          column-gap: 2rem;
          align-items: start;
        }
        main.side h1 { grid-area: title; }
        main.side #side { grid-area: about; }
        main.side #canvases { grid-area: figure; }
        main.side #controls { grid-area: controls; }
      }
      h1 { margin: 0; font-size: 1.75rem; line-height: 1.2; font-weight: 600; }
      #about { color: var(--muted); }
      #about p { margin: 0 0 0.6em; text-wrap: pretty; }
      #about p:last-child { margin-bottom: 0; }
      mtp-canvas { display: block; width: 100%; }
      mtp-canvas svg { display: block; width: 100%; height: auto; border-radius: 8px; }
      #canvases { display: grid; gap: 1rem; }
      /* The controls keep the runtime's own look: the page only lays them out side by side. */
      #controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1.25rem; }
      #controls:empty { display: none; }
      #controls > p { flex-basis: 100%; margin: 0; }
      /* The figure's explanation and its variables, one at a time, under two tabs. */
      #side { display: grid; gap: 0.75rem; align-content: start; min-width: 0; }
      .tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid var(--rule); }
      .tabs button {
        font: inherit;
        font-size: 14px;
        color: var(--muted);
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        padding: 0.3rem 0.6rem;
        cursor: pointer;
      }
      .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
      #values-panel { overflow-x: auto; }
      #values { border-collapse: collapse; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); }
      #values td { padding: 0.15rem 1rem 0.15rem 0; border-bottom: 1px solid var(--rule); }
      /* The dark page. A figure carries its own dark colors, which follow the color-scheme. */
      :root.dark {
        --page-bg: #14161c; --page-fg: #e8e4d8; --muted: #a3a9b5; --rule: #2c3039; --panel: #1b1e25;
        --accent: #8db7e0; color-scheme: dark;
      }
      :root {
        /* The examples' fonts are the document's: BRAIID's content font, and its mono. */
        --mtp-house-variable-family: var(--font-body);
        --mtp-house-number-family: var(--font-mono);
        --mtp-house-code-family: var(--font-mono);
      }
      /* A page restyling a figure's type tokens, also only with CSS. */
      :root.fonts {
        --mtp-heading-family: Palatino, "Book Antiqua", serif;
        --mtp-heading-style: italic;
        --mtp-variable-family: "Times New Roman", serif;
        --mtp-number-family: "Courier New", monospace;
        --mtp-number-weight: 700;
        --mtp-house-variable-family: "Times New Roman", serif;
        --mtp-house-number-family: "Courier New", monospace;
        --mtp-house-number-weight: 700;
      }
    </style>
  </head>
  <body>
    <!-- For trying the runtime by hand: just web-dev, then pick a figure: the examples, the demo,
         the shared cases or the runtime's test fixtures, built to .mtpc by just web-examples. -->
    <header>
      <div class="bar">
        <span class="brand">mathterpiece</span>
        <button id="view" type="button" aria-pressed="false">inventory</button>
        <button id="theme" type="button" aria-pressed="false">dark page</button>
        <button id="fonts" type="button" aria-pressed="false">page fonts</button>
      </div>
    </header>
    <div class="layout">
    <nav id="figures" aria-label="figures">
      <input id="filter" type="search" placeholder="filter" aria-label="filter the figures" />
      <ul id="names"></ul>
    </nav>
    <div id="stage">
    <main>
      <h1 id="title"></h1>
      <section id="side">
        <div class="tabs" role="tablist">
          <button id="tab-about" type="button" role="tab" aria-selected="true">explanation</button>
          <button id="tab-values" type="button" role="tab" aria-selected="false">variables</button>
        </div>
        <div id="about" role="tabpanel"></div>
        <div id="values-panel" role="tabpanel" hidden><table id="values"></table></div>
      </section>
      <mtp-model id="m"></mtp-model>
      <div id="inventory" hidden></div>
      <div id="canvases"></div>
      <div id="controls"></div>
    </main>
    </div>
    </div>
    <script type="module">
      import "/src/index.ts";
      import { inventory } from "/src/inventory.ts";
      const figures = import.meta.glob(
        ["/test/data/examples/*.mtpc", "/test/data/demo/*.mtpc"],
        { query: "?raw", import: "default" },
      );
      const sources = import.meta.glob(
        ["/test/data/examples/*.mtp", "/test/data/demo/*.mtp"],
        { query: "?raw", import: "default" },
      );
      const examples = Object.keys(figures);
      const name = (path) => path.split("/").pop().replace(".mtpc", "");
      // The list of figures: one button each, the current one marked; the filter hides the others.
      const list = document.getElementById("names");
      const filter = document.getElementById("filter");
      // Three kinds of figure: showcases, each showing one feature; showpieces, larger and
      // impressive; and realistic ones, as a paper would have. Any figure not named is a showcase.
      const kinds = {
        showpieces: ["ball-puzzle", "split-screen-race", "three-body", "sorting-race", "pythagoras",
          "function-machine", "times-tables", "golden-tour", "koch-snowflake", "ulam-spiral"],
        realistic: ["bourgain-balls", "bourgain-best-embedding", "bourgain-densities",
          "bourgain-ornament", "bourgain-pair-at-level"],
      };
      const kindOf = (n) => Object.keys(kinds).find((k) => kinds[k].includes(n)) ?? "showcases";
      const order = ["showcases", "showpieces", "realistic"];
      examples.sort((a, b) => order.indexOf(kindOf(name(a))) - order.indexOf(kindOf(name(b))) || name(a).localeCompare(name(b)));
      const headings = {};
      for (const k of order) {
        headings[k] = Object.assign(document.createElement("li"), { className: "kind", textContent: k });
      }
      const items = examples.map((path) => {
        const k = kindOf(name(path));
        if (!headings[k].isConnected) list.append(headings[k]);
        const b = Object.assign(document.createElement("button"), { type: "button", textContent: name(path) });
        b.onclick = () => open(path);
        const li = document.createElement("li");
        li.append(b);
        list.append(li);
        return { path, li, b, kind: k };
      });
      const shown = () => items.filter((it) => !it.li.hidden);
      filter.oninput = () => {
        const q = filter.value.trim().toLowerCase();
        for (const it of items) it.li.hidden = q !== "" && !name(it.path).includes(q);
        // A kind's heading shows while any of its figures does.
        for (const k of order) headings[k].hidden = !items.some((it) => it.kind === k && !it.li.hidden);
      };
      filter.onkeydown = (e) => {
        if (e.key === "Enter" && shown()[0]) open(shown()[0].path);
      };
      // Up and down step through the figures shown, unless a field or a control has the keys.
      document.addEventListener("keydown", (e) => {
        if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
        const t = document.activeElement;
        if (t && t !== filter && t.matches("input, select, textarea, [contenteditable]")) return;
        const visible = shown();
        const at = visible.findIndex((it) => it.path === current);
        const next = visible[at + (e.key === "ArrowDown" ? 1 : -1)];
        if (!next) return;
        e.preventDefault();
        open(next.path);
        next.b.scrollIntoView({ block: "nearest" });
      });
      const params = new URLSearchParams(location.search);
      const chosen = params.get("example");
      // Each example shows either as here, or as the inventory page mtp build writes.
      const viewButton = document.getElementById("view");
      let showInventory = params.get("view") === "inventory";
      let current = examples.find((p) => name(p) === (chosen ?? "controls")) ?? examples[0];
      const open = (path) => {
        current = path;
        load();
      };
      const load = async () => {
        const text = await figures[current]();
        const doc = JSON.parse(text);
        // What the figure is and what to try: its leading comments.
        const source = await sources[current.replace(/\.mtpc$/, ".mtp")]?.();
        // Only the comments the file starts with; the rest explain the code.
        const lines = (source ?? "").split("\n");
        const end = lines.findIndex((l) => l.trim() !== "" && !l.startsWith(";"));
        const about = lines
          .slice(0, end < 0 ? lines.length : end)
          .filter((l) => l.startsWith(";"))
          .map((l) => l.replace(/^;+ ?/, "").trim());
        // The comment's line breaks are the source's, not the text's: its lines run together, and
        // an empty comment line starts a new paragraph.
        const paragraphs = about.join("\n").split(/\n\s*\n/).map((p) => p.split("\n").join(" ").trim());
        document.getElementById("about").replaceChildren(
          ...paragraphs.filter((p) => p).map((p) => Object.assign(document.createElement("p"), { textContent: p })),
        );
        const controls = document.getElementById("controls");
        controls.replaceChildren();
        const canvases = document.getElementById("canvases");
        canvases.replaceChildren();
        // Token values set from an inventory belong to the example they were set on.
        document.documentElement.removeAttribute("style");
        // Canvases and block displays, in the order the source declares them.
        const blocks = (o) => o.kind === "canvas" || (o.kind === "display" && o.as === "block");
        for (const o of showInventory ? [] : doc.objects.filter(blocks)) {
          const el = document.createElement(`mtp-${o.kind}`);
          el.setAttribute("model", "m");
          el.setAttribute("name", o.name);
          canvases.append(el);
        }
        document.getElementById("m").doc = doc;
        const ones = doc.objects.filter((o) => o.kind === "canvas").length === 1;
        document.querySelector("main").classList.toggle("side", ones && !showInventory);
        viewButton.setAttribute("aria-pressed", String(showInventory));
        const inv = document.getElementById("inventory");
        for (const id of ["canvases", "controls"]) document.getElementById(id).hidden = showInventory;
        inv.hidden = !showInventory;
        if (showInventory) {
          // The inventory places its own components, so the usual view places none.
          inventory(inv, text, { model: "m", id: name(current), file: `${name(current)}.mtpc` });
        } else {
          inv.replaceChildren();
        }
        for (const o of showInventory ? [] : doc.objects) {
          if (o.kind === "readout" || (o.kind === "display" && o.as === "inline")) {
            const p = document.createElement("p");
            p.append(`A sentence with the ${o.kind} ${o.name} in it: `);
            const el = document.createElement(`mtp-${o.kind}`);
            el.setAttribute("model", "m");
            el.setAttribute("name", o.name);
            p.append(el, ", and then the sentence goes on.");
            controls.append(p);
            continue;
          }
          if (!["slider", "toggle", "button", "play"].includes(o.kind)) continue;
          const el = document.createElement(`mtp-${o.kind}`);
          el.setAttribute("model", "m");
          el.setAttribute("name", o.name);
          controls.append(el);
        }
        // Every variable and its value, kept current, for figures that are mostly values. A
        // variable holding a let's value is the compiler's, not one the figure declares.
        const model = document.getElementById("m");
        const table = document.getElementById("values");
        const rows = doc.objects.flatMap((o, i) =>
          o.kind === "variable" && o.let === undefined ? [[o.name ?? `#${i}`, i]] : [],
        );
        const show = () => {
          table.replaceChildren(
            ...rows.map(([n, i]) => {
              const tr = document.createElement("tr");
              const v = model.runtime?.value(i);
              for (const text of [n, JSON.stringify(v)]) {
                const td = document.createElement("td");
                td.textContent = text;
                tr.append(td);
              }
              return tr;
            }),
          );
        };
        model.addEventListener("mtp-change", show);
        show();
        // Drawn in the next frames: then the one canvas is fitted to the window.
        requestAnimationFrame(() => requestAnimationFrame(fit));
        for (const it of items) {
          if (it.path === current) it.b.setAttribute("aria-current", "page");
          else it.b.removeAttribute("aria-current");
        }
        document.getElementById("title").textContent = name(current);
        document.title = `${name(current)} · mathterpiece`;
        history.replaceState(null, "", `?example=${name(current)}${showInventory ? "&view=inventory" : ""}`);
      };
      viewButton.onclick = () => {
        showInventory = !showInventory;
        load();
      };
      // A figure with one canvas fits in the window: its text, its formulas, its canvas and its
      // controls, all but the list of variables. The canvas gives up width so that its height,
      // which follows its view box, leaves room for the rest. Figures with several canvases scroll.
      const fit = () => {
        const all = [...document.querySelectorAll("#canvases mtp-canvas")];
        for (const c of all) {
          c.style.maxWidth = "";
        }
        if (showInventory || all.length !== 1) return;
        const c = all[0];
        const box = c.querySelector("svg")?.viewBox?.baseVal;
        if (!box || !box.width || !box.height) return;
        const main = document.querySelector("main").getBoundingClientRect();
        const canvas = c.getBoundingClientRect();
        // Everything in the column but the canvas: the title, the rows and gaps around it, the
        // controls, and the column's padding.
        const rest = main.height - canvas.height;
        const stage = document.getElementById("stage");
        const top = main.top + stage.scrollTop - stage.getBoundingClientRect().top;
        const room = Math.max(200, stage.clientHeight - top - rest);
        const width = (room * box.width) / box.height;
        if (width < canvas.width) {
          c.style.maxWidth = `${width}px`;
        }
      };
      addEventListener("resize", fit);
      // The explanation shows first; the tab chosen stays as the figures change.
      const tabs = [["tab-about", "about"], ["tab-values", "values-panel"]];
      for (const [tab, panel] of tabs) {
        document.getElementById(tab).onclick = () => {
          for (const [t, p] of tabs) {
            document.getElementById(t).setAttribute("aria-selected", String(t === tab));
            document.getElementById(p).hidden = p !== panel;
          }
        };
      }
      for (const [id, cls] of [["theme", "dark"], ["fonts", "fonts"]]) {
        const b = document.getElementById(id);
        b.onclick = () => b.setAttribute("aria-pressed", String(document.documentElement.classList.toggle(cls)));
      }
      load();
    </script>
  </body>
</html>
